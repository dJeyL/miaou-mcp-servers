[project]
name = "miaou-mcp-servers"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "uvicorn",
    "starlette",
    "anyio",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
