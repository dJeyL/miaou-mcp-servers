[project]
name = "miaou-mcp-servers"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "uvicorn",
    "starlette",
    "anyio",
    "pyjwt[crypto]",
    "html2text",
    "pymupdf",
    "python-docx",
    "openpyxl",
    "python-pptx",
    "truststore",
    "pyyaml",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_proxy"]

[project.scripts]
mcp_proxy = "mcp_proxy:main"
